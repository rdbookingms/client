<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms and Conditions</title>
<script src="config.js"></script>
<script src="gas-bridge.js"></script>
<style>body{margin:0;background:#fff}#msg{font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:0 auto;padding:24px 18px;color:#5b6f75}</style>
</head>
<body>
<div id="terms"><p id="msg">Loading the Terms and Conditions…</p></div>
<script>
  google.script.run
    .withSuccessHandler(function (html) {
      document.getElementById('terms').innerHTML = html || '<p id="msg">The Terms and Conditions are not available right now.</p>';
      var h = document.querySelector('#terms h1'); if (h) document.title = h.textContent;
    })
    .withFailureHandler(function (e) {
      document.getElementById('msg').textContent = 'Could not load the Terms and Conditions: ' + (e && e.message ? e.message : e);
    })
    .getTermsPageHtml();
</script>
</body>
</html>
